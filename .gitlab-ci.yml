stages:
  - build
  - deploy

variables:
  NODE_VERSION: "20"

build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      files:
        - auskunftssystem/package-lock.json
    paths:
      - auskunftssystem/node_modules/
  script:
    - cd auskunftssystem
    - npm ci
    - node scripts/fetch-contacts.js
    - npm run build
  artifacts:
    paths:
      - auskunftssystem/dist/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  dependencies:
    - build
  script:
    - mv auskunftssystem/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
